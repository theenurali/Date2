<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <h1>Will you go to the Michael Jackson movie with me?</h1>

    <button class="btn" id="yesButton" onclick="goYes()">Yes</button>
    <button class="btn" id="noButton" onmouseover="moveNo()">No</button>
  </div>

  <script>
    let scale = 1;

    function goYes() {
      window.location.href = "yes.html";
    }

    function moveNo() {
      const no = document.getElementById("noButton");
      const yes = document.getElementById("yesButton");

      const x = Math.random() * (window.innerWidth - no.offsetWidth);
      const y = Math.random() * (window.innerHeight - no.offsetHeight);

      no.style.position = "absolute";
      no.style.left = x + "px";
      no.style.top = y + "px";

      scale += 0.2;
      yes.style.transform = `scale(${scale})`;
    }
  </script>

</body>

</html>
